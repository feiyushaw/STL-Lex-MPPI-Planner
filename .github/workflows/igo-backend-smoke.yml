name: IGO backend smoke

on:
  pull_request:
    branches:
      - igo
      - main
      - feat/replace-mppi-with-fom-igo
    paths:
      - "commonroad-evaluations/**"
      - "effects-of-discretization-and-solver-evaluations/**"
      - "nuplan-evaluations/**"
      - ".github/workflows/igo-backend-smoke.yml"

permissions:
  contents: read

jobs:
  igo-cxx-smoke:
    runs-on: [self-hosted, docker]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install C++ and Python prerequisites using official Ubuntu archives
        shell: bash
        run: |
          set -euxo pipefail
          cat > "$RUNNER_TEMP/igo-ubuntu.sources" <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          APT_SOURCE_ARGS=(
            -o "Dir::Etc::sourcelist=$RUNNER_TEMP/igo-ubuntu.sources"
            -o "Dir::Etc::sourceparts=-"
            -o "APT::Get::List-Cleanup=0"
          )
          sudo apt-get "${APT_SOURCE_ARGS[@]}" update
          sudo apt-get "${APT_SOURCE_ARGS[@]}" install -y --no-install-recommends \
            cmake g++ libeigen3-dev libyaml-cpp-dev libboost-dev libspdlog-dev libpagmo-dev python3-venv python3-dev
          python3 -m venv "$RUNNER_TEMP/igo-ci-venv"
          "$RUNNER_TEMP/igo-ci-venv/bin/python" -m pip install --disable-pip-version-check "setuptools<70" wheel
          "$RUNNER_TEMP/igo-ci-venv/bin/python" -m pip install --disable-pip-version-check numpy scipy pytest pyyaml pybind11
          if [[ -f effects-of-discretization-and-solver-evaluations/tests/test_fixed_budget_benchmark.py ]]; then
            "$RUNNER_TEMP/igo-ci-venv/bin/python" -m pip install --disable-pip-version-check --no-build-isolation pyinterval
          fi

      - name: Verify host C++ dependencies
        shell: bash
        run: |
          set -euxo pipefail
          command -v g++
          test -r /usr/include/eigen3/Eigen/Core
          test -r /usr/include/yaml-cpp/yaml.h
          test -r /usr/include/boost/version.hpp
          test -r /usr/include/spdlog/spdlog.h
          ldconfig -p | grep -q 'libyaml-cpp'
          g++ --version

      - name: Build and run block-xNES regression
        run: |
          g++ -std=c++17 \
            -I/usr/include/eigen3 \
            -Icommonroad-evaluations/lex_stl_planner/cpp/planner \
            commonroad-evaluations/lex_stl_planner/tests/fom_igo_block_updater_test.cpp \
            -o /tmp/fom_igo_block_updater_test
          /tmp/fom_igo_block_updater_test

      - name: Build and run canonical IGO config regression
        run: |
          g++ -std=c++17 \
            -I/usr/include/eigen3 \
            -Icommonroad-evaluations/lex_stl_planner/cpp/config \
            commonroad-evaluations/lex_stl_planner/tests/fom_igo_config_test.cpp \
            -lyaml-cpp \
            -o /tmp/fom_igo_config_test
          cd commonroad-evaluations
          /tmp/fom_igo_config_test

      - name: Run FOM, IGO, and fixed-budget Python regressions
        shell: bash
        run: |
          set -euxo pipefail
          cd effects-of-discretization-and-solver-evaluations
          tests=()
          for path in \
            tests/test_fom_certificate.py \
            tests/test_fom_certificate_igo.py \
            tests/test_fom_igo_solver.py \
            tests/test_fixed_budget_benchmark.py; do
            if [[ -f "$path" ]]; then tests+=("$path"); fi
          done
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "No recognized FOM/IGO regression test files were found" >&2
            exit 1
          fi
          printf 'Running tests: %s\n' "${tests[*]}"
          "$RUNNER_TEMP/igo-ci-venv/bin/python" -m pytest -q "${tests[@]}"

      - name: Run nuPlan Canonical JSONL adapter tests
        shell: bash
        run: |
          if [[ -d nuplan-evaluations/tests ]]; then
            "$RUNNER_TEMP/igo-ci-venv/bin/python" -m unittest discover -s nuplan-evaluations/tests -v
            "$RUNNER_TEMP/igo-ci-venv/bin/python" -m compileall -q nuplan-evaluations
          else
            echo "nuplan-evaluations not present in this merge tree; skipping adapter tests"
          fi

      - name: Configure, build, and import the complete C++/pybind planner
        shell: bash
        run: |
          set -euxo pipefail
          if [[ -x /opt/nuplan_env/bin/python ]]; then
            PY=/opt/nuplan_env/bin/python
          else
            PY="$RUNNER_TEMP/igo-ci-venv/bin/python"
          fi
          "$PY" -m pip install --disable-pip-version-check pybind11 pyyaml
          PYBIND11_DIR="$("$PY" -m pybind11 --cmakedir)"
          cmake -S commonroad-evaluations \
            -B commonroad-evaluations/build-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython_EXECUTABLE="$PY" \
            -DPython3_EXECUTABLE="$PY" \
            -Dpybind11_DIR="$PYBIND11_DIR" \
            -DBUILD_FOM_IGO_TESTS=ON
          cmake --build commonroad-evaluations/build-ci --parallel 2
          ctest --test-dir commonroad-evaluations/build-ci --output-on-failure
          PYTHONPATH="$PWD/commonroad-evaluations" "$PY" - <<'PY'
          from lex_stl_planner.lib.lex_stl_planner_bindings import Config, IGOPlanner
          result_fields = ("success", "failure_reason", "solve_time")
          from lex_stl_planner.lib.lex_stl_planner_bindings import PlannerResult
          result = PlannerResult()
          missing = [name for name in result_fields if not hasattr(result, name)]
          if missing:
              raise SystemExit(f"pybind PlannerResult fields missing: {missing}")
          print(f"pybind ABI/import OK: Config={Config.__name__}, IGOPlanner={IGOPlanner.__name__}")
          PY

      - name: Syntax-check production IGO planner translation unit
        run: |
          g++ -std=c++17 -fopenmp -fsyntax-only \
            -I/usr/include/eigen3 \
            -Icommonroad-evaluations/lex_stl_planner/cpp/config \
            -Icommonroad-evaluations/lex_stl_planner/cpp/planner \
            -Icommonroad-evaluations/lex_stl_planner/cpp/system \
            -Icommonroad-evaluations/lex_stl_planner/cpp/cost \
            -Icommonroad-evaluations/lex_stl_planner/cpp/stl \
            -Icommonroad-evaluations/lex_stl_planner/cpp/utils \
            -Icommonroad-evaluations/lex_stl_planner/cpp/bindings \
            -Icommonroad-evaluations/lex_stl_planner/cpp/profiling \
            -Icommonroad-evaluations/external/frenetix \
            -Icommonroad-evaluations/external/clcs/include \
            -Icommonroad-evaluations/external/third_party/lhslib/src/lhslib \
            -Icommonroad-evaluations/external/third_party/lhslib/src/bclib \
            commonroad-evaluations/lex_stl_planner/cpp/planner/mppi_planner.cpp
